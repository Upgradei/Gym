<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101215">
<title>Training Card</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="brand"><h1>Training <span>Card</span></h1><div class="hdr-right"><span class="version">v2</span><button class="wake" id="wakeBtn" aria-label="Keep screen awake" aria-pressed="false">☀</button></div></div><div class="chips" id="chips"></div></header>
<div id="storageStatus" class="storage-status" role="status" aria-live="polite">Loading saved workouts…</div>
<main id="main"><p>Loading Training Card…</p></main>
<div id="timer" role="timer" aria-label="Rest timer"></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<nav aria-label="Main navigation"><button class="pill on" data-view="workout">Workout</button><button class="pill" data-view="progress">Progress</button><button class="pill" data-action="log">Log</button><button class="pill" data-action="settings">Settings</button></nav>
<dialog id="modal" aria-labelledby="modalTitle"><div class="sheet" id="modalBody"></div></dialog>
<input id="importFile" class="sr-only" type="file" accept="application/json,.json" aria-label="Import Training Card backup">
<noscript><p>This app needs JavaScript to save and display workouts.</p></noscript>
<script type="module" src="app.js"></script>
</body></html>
