name: Training Card checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: npm test
      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser flow at phone size
        run: |
          python3 -m http.server 8080 > /tmp/training-card-server.log 2>&1 &
          node tests/browser.mjs
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-browser-checks
          path: test-results/
